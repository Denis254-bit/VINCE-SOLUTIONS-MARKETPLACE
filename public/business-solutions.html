<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/index.html?view=solutions" />
    <title>Redirecting to Vince Solutions...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 450px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #f59e0b;
        }
        p {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .spinner {
            border: 3px solid rgba(245, 158, 11, 0.1);
            border-top: 3px solid #f59e0b;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #0f172a;
            font-weight: 700;
            font-size: 0.8125rem;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
    <script>
        window.location.href = "/index.html?view=solutions";
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Upgrading Experience</h1>
        <p>Removing raw static pages. We are loading the all-new interactive, fully-responsive Vince & Lenovo Solutions Hub within the React App...</p>
        <a href="/index.html?view=solutions" class="btn">Launch Interface Instantly</a>
    </div>
</body>
</html>
